<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Statuts des postes en salles de TP</title>
    <link rel="shortcut icon" href="data:image/x-icon;," type="image/x-icon">
    <link href="libs/bootstrap.min.css" rel="stylesheet">
    <link href="libs/datatables.min.css" rel="stylesheet">
    <style>
@font-face {
    font-family: 'Lato';
    src: url('fonts/lato-regular-webfont.woff2') format('woff2'),
         url('fonts/lato-regular-webfont.woff') format('woff'),
         url('fonts/lato-regular-webfont.ttf') format('truetype'),
         url('fonts/lato-regular-webfont.svg#latoregular') format('svg');
    font-weight: normal;
    font-style: normal;
}

@font-face {font-family:'Lato';
    src: url('fonts/lato-bold-webfont.woff2') format('woff2'),
         url('fonts/lato-bold-webfont.woff') format('woff'),
         url('fonts/lato-bold-webfont.ttf') format('truetype'),
         url('fonts/lato-bold-webfont.svg#latobold') format('svg');
    font-weight: bold;
    font-style: normal;
}

body {
    background-color: #f5f5f5;
    background-image: url('images/bg.jpg');
    font-family: Lato, Helvetica, Arial, sans-serif;
    padding-top:10px;
}

h1 {
    font-size: 2rem;
}

.box {
    background-color:#fff;
    border:1px solid #ddd;
    border-radius:3px; -moz-border-radius:3px; -webkit-border-radius:3px;
    box-shadow:none;
    margin-bottom:30px;
    margin-top:15px;
    padding:25px 20px;
    overflow:visible;
}

.box div {
    margin-bottom:8px;
}

table.dataTable thead .sorting::after, table.dataTable thead .sorting_asc::after, table.dataTable thead .sorting_desc::after, table.dataTable thead .sorting_asc_disabled::after, table.dataTable thead .sorting_desc_disabled::after {
    content:none;
}

table.dataTable thead .sorting::before, table.dataTable thead .sorting_asc::before, table.dataTable thead .sorting_desc::before, table.dataTable thead .sorting_asc_disabled::before, table.dataTable thead .sorting_desc_disabled::before {
   content:none;
}
    </style>
  </head>
  <body>
    <div class="container">
      <div class="row">
	<div class="col-1">
	  <img title="Télécom Paris" src="images/logo-tp.png" srcset="images/logo-tp@2x.png 2x" alt="Télécom Paris">
	</div>
	<div class="col-11">
	  <h1>Statuts des postes en salles de TP</h1>
	</div>
      </div>
      <div class="row">
	<div class="box col-10 offset-1">
	  <form><div class="row"><div class="col-6">
		<div class="form-group">
		  <label for="host_search">Filtrer les hôtes avec :</label>
		  <input type="text" class="form-control" id="host_search">
		</div>
	      </div>
	      <div class="col-6">
		<div class="form-check">
		  <input class="form-check-input" type="checkbox" value="" id="dispo">
		  <label class="form-check-label" for="dispo">
		    Afficher uniquement les hôtes disponibles
		  </label>
		</div>
		<div class="form-check">
		  <input class="form-check-input" type="checkbox" value="" id="has_session">
		  <label class="form-check-label" for="has_session">
		    Afficher uniquement les hôtes  sans aucune session active
		  </label>
		</div>
	  </div></div></form>
	</div>
      </div>
      <div class="row">
	<div class="col">
	  <table class="table table-striped table-bordered" style="width:100%">
	    <thead>
              <tr>
                <th>Nom</th>
                <th>Statut</th>
                <th>Nombre de sessions</th>
              </tr>
            </thead>
	  </table>
	</div>
      </div>

      <script src="libs/datatables.min.js"></script>
      <script src="libs/bootstrap.min.js"></script>

      <script>
$(document).ready( function () {
    var dt = new DataTable('table', {
	ajax    : 'ajax.php',
	columns : [
	    { data: 0 },
	    { data: null,
	      render : function (data, rype, row) {
		  if (!data[1]) {
		      return '<span class="badge badge-danger">Indisponible</span>'
		  } else if (data[2]) {
		      return '<span class="badge badge-warning">Utilisée localement</span>';
		  } else if (data[3]+data[4]) {
		      return '<span class="badge badge-info">Utilisée à distance</span>';
		  } else {
		      return '<span class="badge badge-success">Libre</span>';
		  };
	      }
	    },
	    { data: null,
	      render : function (data, rype, row) {
		  if (!data[1]) {
		      return "";
		  }
		  var v = '';
		  if (data[2]){
		      v += data[2] + ' sessions locale X';
		  }
		  if (data[3]){
		      if (v) {  v+= ' et ' };
		      v += data[3] + ' sessions bureau à distance';
		  }
		  if (data[4]){
		      if (v) {  v+= ' et ' };
		      v += data[4] + ' sessions SSH';
		  }
		  if (v) {
		      return  (data[2] + data[3] + data[4]) + ' <span data-toggle="tooltip" data-placement="right" title="' + v + '">ⓘ</span>';
		  } else {
		      return 0;
		  }
	      }
	    },
	],
        dom           : 'lrtip',
	paging        : false,
        scrollY       : '50vh',
        scrollCollapse: true,
        language: {
            "infoEmpty":      "Aucune donnée",
            "infoFiltered":   "(filtrage à partir de _MAX_ hôtes)",
            "lengthMenu":     "Affichage de _MENU_ lignes",
            "loadingRecords": "En cours de chargement...",
            "emptyTable":     "Aucune donnée",
            "info":           "Affichage de _TOTAL_ hôtes",
            "zeroRecords":    "Aucune ligne trouvée",
            },
    });

    $("#host_search").on('keyup', function () {
        dt.column(0).search($("#host_search").val()).draw();
    });

    $("#dispo").on('change', function () {
        if ($("#dispo").prop('checked')) {
	    console.log('ici');
            dt.column(1).search('^(?!.*Indisponible).*$', true, false).draw();
        } else {
            dt.column(1).search('').draw();
        }
    });

    $("#has_session").on('change', function () {
        if ($("#has_session").prop('checked')) {
            dt.column(2).search('^0$', true, false).draw();
        } else {
            dt.column(2).search('').draw();
        }
    });
});
	
      </script>
  </body>
</html>
